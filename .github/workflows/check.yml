name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shell/electron/package-lock.json
      - name: Install shell test dependencies
        run: npm --prefix shell/electron ci --ignore-scripts
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Typecheck, build, and test
        run: bash scripts/check.sh

  harness-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the Electron test carrier
        run: |
          npm --prefix shell/electron ci --no-audit --no-fund
          node shell/electron/node_modules/electron/install.js
          sudo chown root:root shell/electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 shell/electron/node_modules/electron/dist/chrome-sandbox
      - name: Verify the newest released harness in DeepDeck's embedded view
        run: xvfb-run -a node scripts/smoke-harness.mjs --latest --full --page
